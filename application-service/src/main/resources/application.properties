spring.application.name=application-service
server.port=8084

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/recruitment-application
spring.data.mongodb.auto-index-creation=true
# Add to application.properties
# File upload limits
# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=false

# Security configuration
security.jwt.enabled=false

# JWT Configuration (dummy values, not used with security disabled)
jwt.secret=dummy_secret_key_not_used_when_security_disabled
jwt.expiration=86400000
server.servlet.context-path=/api

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
